name = "richapps"
pages_build_output_dir = "."
compatibility_date = "2024-01-01"

# 说明：
# - 这是一个 Cloudflare Pages 项目配置，用于部署当前目录下的静态网页（index.html）。
# - 本地预览：npx wrangler pages dev .
# - 实际部署由 .github/workflows/deploy.yml 通过 Cloudflare Pages Action 完成，
#   需要仓库里配置两个 Secrets：CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID。
#   （也可以直接在 Cloudflare 控制台用 “Connect to Git” 一键授权，无需 Token。）
